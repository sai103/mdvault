# push・プルリクエストのたびに、型チェック・テスト・依存パッケージの脆弱性・秘密情報の混入を確認する
name: CI

# 作業は develop で行い、CI が通ったものだけをプルリクエストで main に入れる（docs/ci.md の「ブランチの運用」）
on:
  push:
    branches: [main, develop]
  pull_request:

# 最小権限（リポジトリの読み取りだけ）
permissions:
  contents: read

env:
  WRANGLER_SEND_METRICS: "false"

jobs:
  test:
    name: 型チェック・Worker のテスト・依存パッケージ
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # マシンに入っている古い 22.x ではなく、セキュリティ修正を含む最新の 22.x を使う
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx tsc
      - run: npm test
      # 本番で使う依存（marked・DOMPurify・SimpleWebAuthn・CodeMirror など）に既知の脆弱性があれば失敗させる
      - run: npm run audit
      - run: npm run build

  e2e:
    name: 画面の E2E テスト（Chromium）
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # マシンに入っている古い 22.x ではなく、セキュリティ修正を含む最新の 22.x を使う
          check-latest: true
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  secrets:
    name: 秘密情報の混入（gitleaks）
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          # 履歴全体を調べるため
          fetch-depth: 0
          persist-credentials: false
      # 見つかった値はログに出さない（--redact）。見つかった場所（ファイル・行・ルール・コミット）だけを注釈に出す
      - run: |
          status=0
          docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --no-banner --verbose \
            --report-format json --report-path /repo/gitleaks-report.json || status=$?
          if [ -s gitleaks-report.json ]; then
            jq -r '.[] | "::error file=\(.File),line=\(.StartLine)::gitleaks: \(.RuleID)（コミット \(.Commit[0:7])）"' gitleaks-report.json
          fi
          exit $status
